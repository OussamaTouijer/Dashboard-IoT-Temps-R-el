<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT Temps Réel</title>

    <!-- Librairies externes -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <!-- Configuration MQTT -->
    <script src="config.js" defer></script>
</head>
<body>
    <div class="container py-4">
        <!-- En-tête -->
        <header class="text-center">
            <h1 class="mb-3">Surveillance Environnementale</h1>
            <div id="connection-status" class="alert alert-warning" role="alert" aria-live="polite">
                Connexion en cours...
            </div>
        </header>

        <!-- Contenu principal -->
        <main>
            <!-- Section des valeurs des capteurs -->
            <section class="row text-center">
                <div class="col-md-6 mb-3">
                    <div class="card p-4 h-100">
                        <h2 class="h4">Température</h2>
                        <p class="fs-1 fw-bold" id="temp-value" aria-live="polite">--</p>
                        <span class="text-muted">°C</span>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="card p-4 h-100">
                        <h2 class="h4">Humidité</h2>
                        <p class="fs-1 fw-bold" id="humidity-value" aria-live="polite">--</p>
                        <span class="text-muted">%</span>
                    </div>
                </div>
            </section>

            <!-- Section du graphique -->
            <section class="card mt-4 p-4">
                <div class="chart-container" style="position: relative; height: 400px;">
                    <canvas id="environmentChart" aria-label="Graphique de surveillance environnementale"></canvas>
                </div>
            </section>

            <!-- Section des boutons d'export -->
            <section class="text-center mt-4">
                <button class="btn btn-success me-2" onclick="exportCSV()" aria-label="Exporter les données en CSV">
                    Exporter CSV
                </button>
                <button class="btn btn-primary" onclick="exportJSON()" aria-label="Exporter les données en JSON">
                    Exporter JSON
                </button>
            </section>
        </main>
    </div>

    <!-- Pied de page -->
    <footer class="text-center mt-4 py-3 bg-light">
        <p class="mb-0">&copy; 2023 Surveillance Environnementale. Tous droits réservés.</p>
    </footer>

    <!-- Script principal -->
    <script src="app.js" defer></script>
</body>
</html>
